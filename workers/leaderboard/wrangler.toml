name = "pacebar-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 8 * * *"]   # daily at 08:00 UTC — sync Luma calendar

[[d1_databases]]
binding  = "DB"
database_name = "pacebar-leaderboard"
database_id   = "REPLACE_WITH_DB_ID_AFTER_wrangler_d1_create"
