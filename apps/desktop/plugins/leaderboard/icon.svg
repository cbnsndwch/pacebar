    <path fill="#305154" d="M228.73,1041.03l468.75-121.96-339.44-347.04,218.69-215.58,341.53,347.62,129.89-471.09,298.08,82.19-129.89,471.09,471.41-123.47,79.39,297.77-475.59,122.32,346.26,346.68-220.77,215.01-341.53-347.62-129.89,471.09-298.08-82.18,129.89-471.09-471.41,123.47-77.3-297.19Z"/>
