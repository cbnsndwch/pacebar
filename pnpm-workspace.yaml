# pnpm workspace members. The desktop app lives in apps/desktop; the Cloudflare
# workers in workers/*. The repo root is a pure workspace manager (it holds
# pnpm.overrides/onlyBuiltDependencies, the package-manager pin, and the
# cross-cutting format/lint/version scripts) and is not itself a member.
packages:
  - "apps/*"
  - "workers/*"
